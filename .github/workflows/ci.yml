name: Verify Loopbee
# Pushes to the main branch and pull requests. Pushing a pull request's branch would otherwise run the whole
# matrix twice (push + pull_request) — costly on private repositories, where macOS and Windows minutes are billed.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      # Let every platform finish, so one failure does not hide the others (Linux race tests were cancelled before).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags nogui ./...
      - run: go vet -tags nogui ./...
      - run: go build -tags nogui ./cmd/loopbee
      - if: runner.os == 'Linux'
        run: go test -race -tags nogui ./...

      # macOS: package the app and keep it as a build artifact.
      - if: runner.os == 'macOS'
        run: sh scripts/build-macos.sh
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Loopbee-macos-arm64
          if-no-files-found: error
          path: |
            bin/Loopbee-macos-*.dmg
            bin/Loopbee-macos-*.zip
            bin/Loopbee-macos-*.sha256

      # Windows: package, native lifecycle and WebView2 desktop acceptance.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -DesktopTest
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Loopbee-windows-amd64
          if-no-files-found: error
          path: |
            bin/Loopbee-windows-amd64.exe
            bin/Loopbee-windows-amd64.zip
            bin/Loopbee-windows-amd64.*.sha256
      - if: runner.os == 'Windows'
        run: go test ./cmd/loopbee
      - if: runner.os == 'Windows'
        run: go vet ./cmd/loopbee
      - if: runner.os == 'Windows'
        run: go test -tags desktoptest ./cmd/loopbee -run TestDesktopBrowserArgs
      - if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOOPBEE_NATIVE_TEST_BINARY = (Resolve-Path 'bin/loopbee.exe').Path
          go test ./cmd/loopbee -run TestNativeDesktopLifecycle -v -count=1 -timeout 90s
      - if: runner.os == 'Windows'
        run: npm ci
      - if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          LOOPBEE_DESKTOP_EXE: .test-data/loopbee-desktop-test.exe
          # A fresh directory: only screenshots taken in this run are uploaded, never the ones committed in docs/.
          LOOPBEE_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      - if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/evidence

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: go build -tags nogui -o bin/loopbee ./cmd/loopbee
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
        env:
          LOOPBEE_EVIDENCE_DIR: ${{ runner.temp }}/evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/evidence
